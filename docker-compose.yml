services:
  runtime:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:8081"
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8081
      DATABASE_URL: sqlite:////data/app.sqlite3
      SQLITE_PATH: /data/app.sqlite3
      WORKSPACE_ROOT: /data/workspaces
      RUNTIME_DIR: /data
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_MODEL: ${LLM_MODEL:-agnes-2.0-flash}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://apihub.agnes-ai.com/v1}
      OPENAI_API_KEY: ${LLM_API_KEY:-}
      OPENAI_BASE_URL: ${LLM_BASE_URL:-https://apihub.agnes-ai.com/v1}
      LANGSMITH_ENABLED: ${LANGSMITH_ENABLED:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-megadeepagents}
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://127.0.0.1:5173","http://127.0.0.1:8081"]}
    volumes:
      - ./deploy/data:/data
      - ${HOST_REPOSITORY_ROOT:-./runtime/repositories}:/repositories
