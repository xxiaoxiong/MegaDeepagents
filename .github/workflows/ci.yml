name: CI

# Runs the five verification commands mandated by AGENTS.md on every push and
# pull request.  Previously these checks were manual-only (the review report
# scored CI/CD at 2/10); this workflow makes them gating so a regression in
# ``app/`` or ``frontend/`` cannot merge silently.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (compileall + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install runtime + test deps.  ``-e`` keeps the package importable
          # the same way the Docker image lays it out.
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: compileall (AGENTS.md gate)
        run: python -m compileall -q app

      - name: pytest (AGENTS.md gate)
        env:
          APP_ENV: test
          LLM_API_KEY: test-key
          SQLITE_PATH: /tmp/megadeepagents-ci.sqlite3
          WORKSPACE_ROOT: /tmp/megadeepagents-workspaces
        run: |
          mkdir -p /tmp/megadeepagents-workspaces
          pytest -m "not live_model and not real_langsmith" --maxfail=5 -q

  frontend:
    name: Frontend (test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test (AGENTS.md gate)
        run: npm test -- --run

      - name: Build (AGENTS.md gate)
        run: npm run build

  website:
    name: Website (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (AGENTS.md gate)
        run: npm run build
